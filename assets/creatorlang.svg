<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="langBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a1c"/>
      <stop offset="50%" stop-color="#1f0f29"/>
      <stop offset="100%" stop-color="#0a050f"/>
    </linearGradient>
    <linearGradient id="amberPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="lGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#langBg)"/>

  <!-- Top Banner -->
  <rect x="50" y="25" width="700" height="40" rx="8" fill="#1b0e26" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <text x="75" y="50" fill="#fbbf24" font-family="'Space Grotesk', monospace" font-size="13" font-weight="bold" letter-spacing="2">CREATORLANG &amp; VSS-LANG // COMPILER &amp; DSL ECOSYSTEM</text>
  <text x="690" y="50" fill="#c084fc" font-family="monospace" font-size="11" text-anchor="end">CUSTOM SYNTAX ENGINE</text>

  <!-- Left: Source Code with Telugu Keywords / Creator Syntax -->
  <g transform="translate(60, 95)">
    <rect width="200" height="270" rx="12" fill="#170c22" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <rect x="15" y="15" width="170" height="24" rx="4" fill="rgba(245,158,11,0.1)"/>
    <text x="100" y="32" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">SOURCE DSL SCRIPT</text>

    <rect x="15" y="50" width="170" height="200" rx="6" fill="#0c0512"/>
    <text x="25" y="75" fill="#f43f5e" font-family="monospace" font-size="11">create_scene <tspan fill="#e2e8f0">CyberCity {</tspan></text>
    <text x="35" y="95" fill="#38bdf8" font-family="monospace" font-size="10">terrain: <tspan fill="#a78bfa">grid_mesh,</tspan></text>
    <text x="35" y="112" fill="#38bdf8" font-family="monospace" font-size="10">buildings: <tspan fill="#f59e0b">generate(40),</tspan></text>
    <text x="35" y="129" fill="#38bdf8" font-family="monospace" font-size="10">lighting: <tspan fill="#34d399">neon_violet,</tspan></text>
    <text x="25" y="148" fill="#e2e8f0" font-family="monospace" font-size="11">}</text>

    <line x1="25" y1="160" x2="175" y2="160" stroke="#231333" stroke-width="1"/>
    <text x="25" y="180" fill="#a78bfa" font-family="monospace" font-size="10">// VSS-Lang Grammar:</text>
    <text x="25" y="200" fill="#fbbf24" font-family="monospace" font-size="10">cheppu <tspan fill="#94a3b8">"Hello World"</tspan></text>
    <text x="25" y="220" fill="#38bdf8" font-family="monospace" font-size="10">choopinchu <tspan fill="#e2e8f0">(result)</tspan></text>
    <text x="25" y="238" fill="#34d399" font-family="monospace" font-size="9">Native AST Execution</text>
  </g>

  <!-- Connectors -->
  <line x1="260" y1="230" x2="310" y2="230" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Center: Lexer & AST Parser Tree -->
  <g transform="translate(310, 95)" filter="url(#lGlow)">
    <rect width="180" height="270" rx="14" fill="#201030" stroke="url(#amberPurple)" stroke-width="2"/>
    <text x="90" y="32" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">PARSER &amp; AST</text>

    <!-- Tree nodes -->
    <circle cx="90" cy="75" r="14" fill="#f59e0b"/>
    <text x="90" y="79" fill="#000" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">ROOT</text>

    <circle cx="45" cy="130" r="12" fill="#c084fc"/>
    <text x="45" y="134" fill="#000" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">STMT</text>

    <circle cx="135" cy="130" r="12" fill="#c084fc"/>
    <text x="135" y="134" fill="#000" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">DECL</text>

    <circle cx="30" cy="180" r="10" fill="#38bdf8"/>
    <circle cx="65" cy="180" r="10" fill="#38bdf8"/>
    <circle cx="115" cy="180" r="10" fill="#34d399"/>
    <circle cx="155" cy="180" r="10" fill="#34d399"/>

    <line x1="90" y1="89" x2="45" y2="118" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="90" y1="89" x2="135" y2="118" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="45" y1="142" x2="30" y2="170" stroke="#c084fc" stroke-width="1.5"/>
    <line x1="45" y1="142" x2="65" y2="170" stroke="#c084fc" stroke-width="1.5"/>
    <line x1="135" y1="142" x2="115" y2="170" stroke="#c084fc" stroke-width="1.5"/>
    <line x1="135" y1="142" x2="155" y2="170" stroke="#c084fc" stroke-width="1.5"/>

    <rect x="15" y="210" width="150" height="45" rx="6" fill="#100619"/>
    <text x="25" y="228" fill="#fbbf24" font-family="monospace" font-size="9">Grammar: Recursive Descent</text>
    <text x="25" y="243" fill="#34d399" font-family="monospace" font-size="9">Tokens: 0% Memory Leak</text>
  </g>

  <!-- Connectors -->
  <line x1="490" y1="230" x2="540" y2="230" stroke="#c084fc" stroke-width="2"/>

  <!-- Right: Multi-Modal Output Pipeline -->
  <g transform="translate(540, 95)">
    <rect width="200" height="270" rx="12" fill="#170c22" stroke="rgba(192,132,252,0.3)" stroke-width="1"/>
    <text x="20" y="30" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold">TARGET GENERATION</text>

    <!-- 3D Mesh Output Card -->
    <rect x="15" y="50" width="170" height="55" rx="6" fill="#241235"/>
    <text x="25" y="70" fill="#fbbf24" font-family="monospace" font-size="9">GENERATOR // 3D MESH</text>
    <text x="25" y="88" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">GLTF / Three.js Export</text>
    <text x="25" y="99" fill="#94a3b8" font-family="monospace" font-size="8">Procedural geometry pipeline</text>

    <!-- Video & Image Synthesis Card -->
    <rect x="15" y="115" width="170" height="55" rx="6" fill="#241235"/>
    <text x="25" y="135" fill="#38bdf8" font-family="monospace" font-size="9">GENERATOR // MOTION</text>
    <text x="25" y="153" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Dynamic Keyframe Synth</text>
    <text x="25" y="164" fill="#94a3b8" font-family="monospace" font-size="8">Real-time video rendering</text>

    <!-- Compiler Binary Card -->
    <rect x="15" y="180" width="170" height="70" rx="6" fill="#241235"/>
    <text x="25" y="200" fill="#34d399" font-family="monospace" font-size="9">BYTECODE VM // RUNTIME</text>
    <text x="25" y="218" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">High-Performance Eval</text>
    <text x="25" y="235" fill="#c084fc" font-family="monospace" font-size="8">Single-pass JIT compilation</text>
  </g>

  <!-- Bottom Tag -->
  <text x="400" y="415" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">ARCHITECTED BY VOOKA SAI SIDDHARTH • VSS COMPILER LABS</text>
</svg>
