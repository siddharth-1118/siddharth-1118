<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0816"/>
      <stop offset="50%" stop-color="#140e2b"/>
      <stop offset="100%" stop-color="#07060e"/>
    </linearGradient>
    <linearGradient id="violetCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1838"/>
      <stop offset="100%" stop-color="#120d24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(139, 92, 246, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Glowing background orbs -->
  <circle cx="400" cy="225" r="180" fill="#8b5cf6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="680" cy="120" r="120" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>

  <!-- Header Banner -->
  <rect x="40" y="25" width="720" height="45" rx="8" fill="#18132e" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1"/>
  <text x="60" y="53" fill="#a78bfa" font-family="'Space Grotesk', monospace" font-size="14" font-weight="bold" letter-spacing="2">SYSTEM-ONE DECISION INTELLIGENCE ARCHITECTURE // PYTORCH NATIVE</text>
  <rect x="650" y="37" width="90" height="22" rx="11" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1"/>
  <text x="695" y="52" fill="#c4b5fd" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1-PASS PARALLEL</text>

  <!-- Input Node -->
  <g transform="translate(50, 110)">
    <rect width="180" height="260" rx="12" fill="url(#boxGrad)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5"/>
    <rect x="15" y="15" width="150" height="24" rx="4" fill="rgba(139, 92, 246, 0.15)"/>
    <text x="90" y="32" fill="#c4b5fd" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">RAW STATE VECTOR</text>
    
    <rect x="15" y="50" width="150" height="85" rx="6" fill="#0d091a" stroke="rgba(255,255,255,0.05)"/>
    <text x="25" y="70" fill="#a78bfa" font-family="monospace" font-size="10">state = {</text>
    <text x="35" y="85" fill="#94a3b8" font-family="monospace" font-size="9">"message": "Card double",</text>
    <text x="35" y="99" fill="#94a3b8" font-family="monospace" font-size="9">"age_days": 421,</text>
    <text x="35" y="113" fill="#94a3b8" font-family="monospace" font-size="9">"risk_tier": "A1"</text>
    <text x="25" y="127" fill="#a78bfa" font-family="monospace" font-size="10">}</text>

    <rect x="15" y="145" width="150" height="105" rx="6" fill="#0d091a" stroke="rgba(255,255,255,0.05)"/>
    <text x="25" y="165" fill="#38bdf8" font-family="monospace" font-size="10">questions = [</text>
    <text x="35" y="180" fill="#94a3b8" font-family="monospace" font-size="9">? department: choice</text>
    <text x="35" y="195" fill="#94a3b8" font-family="monospace" font-size="9">? refund_req: bool</text>
    <text x="35" y="210" fill="#94a3b8" font-family="monospace" font-size="9">? urgency: 0..10</text>
    <text x="35" y="225" fill="#94a3b8" font-family="monospace" font-size="9">? action: route</text>
    <text x="25" y="240" fill="#38bdf8" font-family="monospace" font-size="10">]</text>
  </g>

  <!-- Connectors from Input to Neural Core -->
  <path d="M 230 180 C 270 180, 280 210, 310 210" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 230 240 C 270 240, 280 230, 310 230" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="270" cy="210" r="4" fill="#a78bfa" filter="url(#glow)"/>

  <!-- Neural Core Backbone -->
  <g transform="translate(310, 100)">
    <rect width="180" height="280" rx="16" fill="url(#boxGrad)" stroke="url(#violetCyan)" stroke-width="2" filter="url(#glow)"/>
    <rect x="20" y="20" width="140" height="26" rx="6" fill="rgba(139, 92, 246, 0.25)"/>
    <text x="90" y="38" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">VSS NEURAL CORE</text>
    
    <!-- Multi-head attention visual -->
    <g transform="translate(25, 65)">
      <!-- Node layers -->
      <circle cx="20" cy="30" r="8" fill="#8b5cf6"/>
      <circle cx="20" cy="70" r="8" fill="#8b5cf6"/>
      <circle cx="20" cy="110" r="8" fill="#8b5cf6"/>
      <circle cx="20" cy="150" r="8" fill="#8b5cf6"/>

      <circle cx="65" cy="45" r="9" fill="#06b6d4"/>
      <circle cx="65" cy="90" r="9" fill="#a855f7"/>
      <circle cx="65" cy="135" r="9" fill="#06b6d4"/>

      <circle cx="110" cy="30" r="8" fill="#8b5cf6"/>
      <circle cx="110" cy="70" r="8" fill="#8b5cf6"/>
      <circle cx="110" cy="110" r="8" fill="#8b5cf6"/>
      <circle cx="110" cy="150" r="8" fill="#8b5cf6"/>

      <!-- Synapse lines -->
      <line x1="28" y1="30" x2="56" y2="45" stroke="rgba(139, 92, 246, 0.5)" stroke-width="1.5"/>
      <line x1="28" y1="70" x2="56" y2="45" stroke="rgba(139, 92, 246, 0.5)" stroke-width="1.5"/>
      <line x1="28" y1="70" x2="56" y2="90" stroke="rgba(139, 92, 246, 0.8)" stroke-width="2"/>
      <line x1="28" y1="110" x2="56" y2="90" stroke="rgba(139, 92, 246, 0.8)" stroke-width="2"/>
      <line x1="28" y1="110" x2="56" y2="135" stroke="rgba(139, 92, 246, 0.5)" stroke-width="1.5"/>
      <line x1="28" y1="150" x2="56" y2="135" stroke="rgba(139, 92, 246, 0.5)" stroke-width="1.5"/>

      <line x1="74" y1="45" x2="102" y2="30" stroke="rgba(6, 182, 212, 0.6)" stroke-width="1.5"/>
      <line x1="74" y1="45" x2="102" y2="70" stroke="rgba(6, 182, 212, 0.6)" stroke-width="1.5"/>
      <line x1="74" y1="90" x2="102" y2="70" stroke="rgba(168, 85, 247, 0.8)" stroke-width="2"/>
      <line x1="74" y1="90" x2="102" y2="110" stroke="rgba(168, 85, 247, 0.8)" stroke-width="2"/>
      <line x1="74" y1="135" x2="102" y2="110" stroke="rgba(6, 182, 212, 0.6)" stroke-width="1.5"/>
      <line x1="74" y1="135" x2="102" y2="150" stroke="rgba(6, 182, 212, 0.6)" stroke-width="1.5"/>
    </g>

    <text x="90" y="260" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">FORWARD PASS (1x)</text>
  </g>

  <!-- Split Connectors to Outputs -->
  <path d="M 490 170 C 520 170, 530 135, 560 135" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <path d="M 490 210 C 520 210, 530 200, 560 200" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <path d="M 490 240 C 520 240, 530 265, 560 265" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M 490 270 C 520 270, 530 330, 560 330" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- Output Deciders (Parallel Results) -->
  <g transform="translate(560, 105)">
    <!-- Card 1 -->
    <rect width="200" height="55" rx="8" fill="url(#boxGrad)" stroke="rgba(139, 92, 246, 0.5)" stroke-width="1"/>
    <text x="15" y="22" fill="#94a3b8" font-family="monospace" font-size="9">DEPARTMENT // CHOICE</text>
    <text x="15" y="42" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">"billing" <tspan fill="#34d399" font-size="11">(98.4%)</tspan></text>

    <!-- Card 2 -->
    <rect y="65" width="200" height="55" rx="8" fill="url(#boxGrad)" stroke="rgba(6, 182, 212, 0.5)" stroke-width="1"/>
    <text x="15" y="87" fill="#94a3b8" font-family="monospace" font-size="9">REFUND_REQUESTED // BOOL</text>
    <text x="15" y="107" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">True <tspan fill="#34d399" font-size="11">(99.1% conf)</tspan></text>

    <!-- Card 3 -->
    <rect y="130" width="200" height="55" rx="8" fill="url(#boxGrad)" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1"/>
    <text x="15" y="152" fill="#94a3b8" font-family="monospace" font-size="9">URGENCY // SCORE (0..10)</text>
    <text x="15" y="172" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">8.7 / 10 <tspan fill="#f59e0b" font-size="11">(High)</tspan></text>

    <!-- Card 4 -->
    <rect y="195" width="200" height="55" rx="8" fill="url(#boxGrad)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1"/>
    <text x="15" y="217" fill="#94a3b8" font-family="monospace" font-size="9">LATENCY &amp; ARCHITECTURE</text>
    <text x="15" y="237" fill="#c4b5fd" font-family="monospace" font-size="12" font-weight="bold">12.4ms // No LLM Wrapper</text>
  </g>

  <!-- Footer Tag -->
  <text x="400" y="420" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" letter-spacing="1">ENGINEERED BY VOOKA SAI SIDDHARTH • VSS CORE ECOSYSTEM</text>
</svg>
