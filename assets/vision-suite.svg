<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="visBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05141c"/>
      <stop offset="50%" stop-color="#020d13"/>
      <stop offset="100%" stop-color="#010609"/>
    </linearGradient>
    <linearGradient id="emeraldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="visGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#visBg)"/>

  <!-- Scanning grid and HUD elements -->
  <g opacity="0.25">
    <circle cx="400" cy="225" r="160" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="8,6"/>
    <circle cx="400" cy="225" r="220" fill="none" stroke="#06b6d4" stroke-width="1"/>
    <line x1="400" y1="20" x2="400" y2="430" stroke="#10b981" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="50" y1="225" x2="750" y2="225" stroke="#10b981" stroke-width="0.5" stroke-dasharray="4,4"/>
  </g>

  <!-- Top Title Bar -->
  <rect x="50" y="25" width="700" height="40" rx="6" fill="#071b24" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
  <text x="70" y="50" fill="#34d399" font-family="'Space Grotesk', monospace" font-size="13" font-weight="bold" letter-spacing="2">COMPUTER VISION SUITE // SPATIAL PERCEPTION &amp; BIOMETRICS</text>
  <text x="690" y="50" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="end">OPENCV + MEDIAPIPE</text>

  <!-- Left: Biometric Face Unlock HUD -->
  <g transform="translate(60, 95)">
    <rect width="190" height="270" rx="12" fill="#061822" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <text x="20" y="30" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">FACE_UNLOCK AUTH</text>
    
    <!-- Face mesh wireframe -->
    <ellipse cx="95" cy="110" rx="45" ry="60" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <!-- Eye nodes -->
    <circle cx="75" cy="100" r="6" fill="none" stroke="#34d399" stroke-width="2"/>
    <circle cx="115" cy="100" r="6" fill="none" stroke="#34d399" stroke-width="2"/>
    <circle cx="95" cy="120" r="3" fill="#38bdf8"/>
    <!-- Target reticle -->
    <line x1="50" y1="110" x2="60" y2="110" stroke="#34d399" stroke-width="2"/>
    <line x1="130" y1="110" x2="140" y2="110" stroke="#34d399" stroke-width="2"/>

    <rect x="15" y="190" width="160" height="60" rx="6" fill="#020c12"/>
    <text x="25" y="210" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">STATUS: AUTHORIZED</text>
    <text x="25" y="225" fill="#94a3b8" font-family="monospace" font-size="9">Command Voice + Face ID</text>
    <text x="25" y="238" fill="#38bdf8" font-family="monospace" font-size="9">Match Score: 99.8%</text>
  </g>

  <!-- Center: Skeletal Hand Gesture (Iron Man tracking) -->
  <g transform="translate(300, 90)" filter="url(#visGlow)">
    <rect width="200" height="280" rx="14" fill="#041a24" stroke="url(#emeraldCyan)" stroke-width="2"/>
    <text x="100" y="30" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">21-POINT SKELETAL RIG</text>

    <!-- Hand skeleton landmarks -->
    <!-- Wrist -->
    <circle cx="100" cy="225" r="6" fill="#10b981"/>

    <!-- Palm bases -->
    <circle cx="70" cy="180" r="5" fill="#34d399"/>
    <circle cx="85" cy="165" r="5" fill="#34d399"/>
    <circle cx="100" cy="160" r="5" fill="#34d399"/>
    <circle cx="118" cy="165" r="5" fill="#34d399"/>
    <circle cx="132" cy="175" r="5" fill="#34d399"/>

    <!-- Thumb -->
    <circle cx="55" cy="155" r="4" fill="#06b6d4"/>
    <circle cx="45" cy="135" r="5" fill="#38bdf8"/>

    <!-- Index Finger -->
    <circle cx="82" cy="130" r="4" fill="#06b6d4"/>
    <circle cx="80" cy="100" r="4" fill="#06b6d4"/>
    <circle cx="78" cy="70" r="5" fill="#38bdf8"/>

    <!-- Middle Finger -->
    <circle cx="100" cy="120" r="4" fill="#06b6d4"/>
    <circle cx="100" cy="90" r="4" fill="#06b6d4"/>
    <circle cx="100" cy="60" r="5" fill="#38bdf8"/>

    <!-- Ring Finger -->
    <circle cx="118" cy="125" r="4" fill="#06b6d4"/>
    <circle cx="118" cy="98" r="4" fill="#06b6d4"/>
    <circle cx="118" cy="72" r="5" fill="#38bdf8"/>

    <!-- Pinky Finger -->
    <circle cx="135" cy="140" r="4" fill="#06b6d4"/>
    <circle cx="138" cy="118" r="4" fill="#06b6d4"/>
    <circle cx="140" cy="95" r="5" fill="#38bdf8"/>

    <!-- Bones (Lines) -->
    <!-- Wrist to bases -->
    <line x1="100" y1="225" x2="70" y2="180" stroke="#10b981" stroke-width="1.5"/>
    <line x1="100" y1="225" x2="85" y2="165" stroke="#10b981" stroke-width="1.5"/>
    <line x1="100" y1="225" x2="100" y2="160" stroke="#10b981" stroke-width="1.5"/>
    <line x1="100" y1="225" x2="118" y2="165" stroke="#10b981" stroke-width="1.5"/>
    <line x1="100" y1="225" x2="132" y2="175" stroke="#10b981" stroke-width="1.5"/>

    <!-- Thumb chain -->
    <line x1="70" y1="180" x2="55" y2="155" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="55" y1="155" x2="45" y2="135" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Index chain -->
    <line x1="85" y1="165" x2="82" y2="130" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="82" y1="130" x2="80" y2="100" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="80" y1="100" x2="78" y2="70" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Middle chain -->
    <line x1="100" y1="160" x2="100" y2="120" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="100" y1="120" x2="100" y2="90" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="100" y1="90" x2="100" y2="60" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Ring chain -->
    <line x1="118" y1="165" x2="118" y2="125" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="118" y1="125" x2="118" y2="98" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="118" y1="98" x2="118" y2="72" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Pinky chain -->
    <line x1="132" y1="175" x2="135" y2="140" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="135" y1="140" x2="138" y2="118" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="138" y1="118" x2="140" y2="95" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Holographic ring on tip -->
    <circle cx="78" cy="70" r="14" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="100" y="255" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">GESTURE: PINCH_DRAG</text>
  </g>

  <!-- Right: Air Draw Canvas Coordinates -->
  <g transform="translate(550, 95)">
    <rect width="190" height="270" rx="12" fill="#061822" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <text x="20" y="30" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">AIR_DRAW 3D CANVAS</text>
    
    <!-- Mid-air drawing trajectory curve -->
    <path d="M 30 140 Q 60 70, 95 110 T 160 80" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#visGlow)"/>
    <circle cx="160" cy="80" r="4" fill="#ffffff"/>

    <rect x="15" y="160" width="160" height="90" rx="6" fill="#020c12"/>
    <text x="25" y="180" fill="#94a3b8" font-family="monospace" font-size="9">SPATIAL POSITION:</text>
    <text x="25" y="196" fill="#e2e8f0" font-family="monospace" font-size="11">X: 524.3 px</text>
    <text x="25" y="210" fill="#e2e8f0" font-family="monospace" font-size="11">Y: 289.1 px</text>
    <text x="25" y="224" fill="#34d399" font-family="monospace" font-size="11">Z: 14.8 cm (Pinch)</text>
    <text x="25" y="240" fill="#38bdf8" font-family="monospace" font-size="9">Smoothing: Kalman Filter</text>
  </g>

  <!-- Bottom Tag -->
  <text x="400" y="415" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">IRON MAN INTERFACE PARADIGM // DEVELOPED BY SAI SIDDHARTH</text>
</svg>
