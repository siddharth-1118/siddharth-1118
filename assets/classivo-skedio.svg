    <text x="25" y="120" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Design &amp; Analysis of Algo</text>
    <text x="25" y="135" fill="#38bdf8" font-family="monospace" font-size="9">11:00 - 12:30 • TP 405 • Attended ✓</text>

    <rect x="15" y="155" width="180" height="45" rx="6" fill="#152e52"/>
    <text x="25" y="175" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Computer Networks &amp; Sec</text>
    <text x="25" y="190" fill="#a78bfa" font-family="monospace" font-size="9">13:30 - 15:10 • Tech Park • Today</text>

