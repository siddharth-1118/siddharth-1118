<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sigBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12071f"/>
      <stop offset="60%" stop-color="#0a0312"/>
      <stop offset="100%" stop-color="#050109"/>
    </linearGradient>
    <linearGradient id="sigGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#sigBg)"/>

  <!-- Radial grid glow -->
  <circle cx="400" cy="225" r="220" fill="#a855f7" opacity="0.08" filter="url(#fGlow)"/>

  <!-- Top Title Bar -->
  <rect x="50" y="30" width="700" height="40" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1"/>
  <text x="75" y="55" fill="#f472b6" font-family="'Space Grotesk', monospace" font-size="13" font-weight="bold" letter-spacing="2">SIGNAL // MULTI-MODAL PRIORITY AI OPERATING SYSTEM</text>
  <text x="690" y="55" fill="#34d399" font-family="monospace" font-size="11" text-anchor="end">SYS_KERNEL: ONLINE</text>

  <!-- Left: Event Stream Ingestion -->
  <g transform="translate(60, 100)">
    <rect width="180" height="260" rx="10" fill="#150a22" stroke="rgba(236,72,153,0.3)" stroke-width="1"/>
    <text x="20" y="30" fill="#f472b6" font-family="monospace" font-size="11" font-weight="bold">INCOMING TELEMETRY</text>
    
    <rect x="15" y="45" width="150" height="45" rx="6" fill="#1e1030"/>
    <text x="25" y="65" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Urgent DevOps Alert</text>
    <text x="25" y="80" fill="#ec4899" font-family="monospace" font-size="9">Weight: 0.98 • Auto-Escalate</text>

    <rect x="15" y="100" width="150" height="45" rx="6" fill="#1e1030"/>
    <text x="25" y="120" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Executive Mail Dispatch</text>
    <text x="25" y="135" fill="#f59e0b" font-family="monospace" font-size="9">Weight: 0.84 • High Priority</text>

    <rect x="15" y="155" width="150" height="45" rx="6" fill="#1e1030"/>
    <text x="25" y="175" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Automated Pipeline Syn</text>
    <text x="25" y="190" fill="#64748b" font-family="monospace" font-size="9">Weight: 0.22 • Batch Queue</text>

    <rect x="15" y="210" width="150" height="35" rx="6" fill="#0d0517"/>
    <text x="90" y="232" fill="#a78bfa" font-family="monospace" font-size="10" text-anchor="middle">Streaming 1,420 evt/s</text>
  </g>

  <!-- Connectors -->
  <line x1="240" y1="230" x2="310" y2="230" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Center: Priority AI Scoring Engine -->
  <g transform="translate(310, 95)">
    <rect width="180" height="270" rx="14" fill="#1c0b30" stroke="url(#sigGlow)" stroke-width="2" filter="url(#fGlow)"/>
    <text x="90" y="35" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">SIGNAL NEURAL ROUTER</text>

    <!-- Visual Waveform and Radar Ring -->
    <circle cx="90" cy="120" r="50" fill="none" stroke="rgba(236,72,153,0.3)" stroke-width="2"/>
    <circle cx="90" cy="120" r="30" fill="none" stroke="rgba(139,92,246,0.5)" stroke-width="2"/>
    <circle cx="90" cy="120" r="10" fill="#ec4899"/>
    <!-- Radar sweep line -->
    <line x1="90" y1="120" x2="135" y2="85" stroke="#f472b6" stroke-width="2"/>

    <rect x="20" y="190" width="140" height="60" rx="6" fill="#0d0517"/>
    <text x="30" y="210" fill="#a78bfa" font-family="monospace" font-size="9">ATTENTION HEURISTIC:</text>
    <text x="30" y="225" fill="#f472b6" font-family="monospace" font-size="10" font-weight="bold">Context-Aware Graph</text>
    <text x="30" y="240" fill="#34d399" font-family="monospace" font-size="9">Decision Latency: 4ms</text>
  </g>

  <!-- Connectors -->
  <line x1="490" y1="230" x2="560" y2="230" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Right: Automated Dispatch & Action Matrix -->
  <g transform="translate(560, 100)">
    <rect width="180" height="260" rx="10" fill="#150a22" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
    <text x="20" y="30" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="bold">AUTONOMOUS DISPATCH</text>
    
    <rect x="15" y="45" width="150" height="55" rx="6" fill="#1a0d2e" stroke="rgba(52,211,153,0.3)"/>
    <text x="25" y="65" fill="#34d399" font-family="monospace" font-size="9">ACTION: INSTANT SYNTH</text>
    <text x="25" y="82" fill="#ffffff" font-family="sans-serif" font-size="11">Telegram / Discord Bot</text>
    <text x="25" y="93" fill="#94a3b8" font-family="monospace" font-size="8">Trigger: Latency critical</text>

    <rect x="15" y="110" width="150" height="55" rx="6" fill="#1a0d2e"/>
    <text x="25" y="130" fill="#a78bfa" font-family="monospace" font-size="9">ACTION: CALENDAR LOCK</text>
    <text x="25" y="147" fill="#ffffff" font-family="sans-serif" font-size="11">Dynamic Time Blocking</text>
    <text x="25" y="158" fill="#94a3b8" font-family="monospace" font-size="8">Auto-declines low intent</text>

    <rect x="15" y="175" width="150" height="55" rx="6" fill="#1a0d2e"/>
    <text x="25" y="195" fill="#38bdf8" font-family="monospace" font-size="9">ACTION: AGENT TASK</text>
    <text x="25" y="212" fill="#ffffff" font-family="sans-serif" font-size="11">VSS Sub-Agent Delegator</text>
    <text x="25" y="223" fill="#94a3b8" font-family="monospace" font-size="8">Executes background code</text>
  </g>

  <!-- Status pill -->
  <text x="400" y="410" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">SIGNAL ARCHITECTURE // ENGINEERED BY SAI SIDDHARTH</text>
</svg>
