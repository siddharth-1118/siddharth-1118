<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="anBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#071b2f"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="anGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#anBg)"/>

  <!-- Perspective 3D Grid Floor -->
  <g opacity="0.35">
    <line x1="0" y1="450" x2="400" y2="220" stroke="#06b6d4" stroke-width="1"/>
    <line x1="160" y1="450" x2="400" y2="220" stroke="#06b6d4" stroke-width="1"/>
    <line x1="320" y1="450" x2="400" y2="220" stroke="#06b6d4" stroke-width="1"/>
    <line x1="480" y1="450" x2="400" y2="220" stroke="#06b6d4" stroke-width="1"/>
    <line x1="640" y1="450" x2="400" y2="220" stroke="#06b6d4" stroke-width="1"/>
    <line x1="800" y1="450" x2="400" y2="220" stroke="#06b6d4" stroke-width="1"/>

    <line x1="100" y1="400" x2="700" y2="400" stroke="#0284c7" stroke-width="1"/>
    <line x1="200" y1="340" x2="600" y2="340" stroke="#0284c7" stroke-width="1"/>
    <line x1="280" y1="280" x2="520" y2="280" stroke="#0284c7" stroke-width="1"/>
    <line x1="340" y1="240" x2="460" y2="240" stroke="#0284c7" stroke-width="1"/>
  </g>

  <!-- 3D Geometric Campus Hologram Wireframe -->
  <g transform="translate(400, 180)" filter="url(#anGlow)">
    <!-- Central Polyhedral Building -->
    <polygon points="0,-70 55,-35 55,45 0,80 -55,45 -55,-35" fill="rgba(6, 182, 212, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="0" y1="-70" x2="0" y2="80" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="0" y1="80" x2="55" y2="-35" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <line x1="0" y1="80" x2="-55" y2="-35" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    
    <!-- Outer orbiting rings -->
    <ellipse cx="0" cy="0" rx="140" ry="45" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6,4" transform="rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="110" ry="35" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,6" transform="rotate(25)"/>

    <circle cx="95" cy="-28" r="5" fill="#38bdf8"/>
    <circle cx="-110" cy="20" r="4" fill="#a855f7"/>
  </g>

  <!-- Glass Dashboard Floating Overlays -->
  <!-- Left HUD Widget: Attendance Analytics -->
  <g transform="translate(50, 70)">
    <rect width="210" height="150" rx="12" fill="rgba(10, 25, 47, 0.75)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="20" y="32" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">SRM ACADEMIA METRICS</text>
    <text x="20" y="65" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="900">92.4%</text>
    <text x="120" y="65" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">+SAFE TIER</text>
    <text x="20" y="85" fill="#94a3b8" font-family="sans-serif" font-size="11">Aggregate Overall Attendance</text>
    <!-- Progress bar -->
    <rect x="20" y="105" width="170" height="6" rx="3" fill="#1e293b"/>
    <rect x="20" y="105" width="157" height="6" rx="3" fill="url(#cyanBlue)"/>
    <text x="20" y="130" fill="#64748b" font-family="monospace" font-size="10">KTR Campus // S2 Tech Class</text>
  </g>

  <!-- Right HUD Widget: Real-time Schedule & AI Assistant -->
  <g transform="translate(540, 70)">
    <rect width="210" height="150" rx="12" fill="rgba(10, 25, 47, 0.75)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1"/>
    <text x="20" y="32" fill="#818cf8" font-family="monospace" font-size="11" font-weight="bold">AI COMPANION STATUS</text>
    <rect x="20" y="48" width="170" height="35" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.05)"/>
    <text x="30" y="66" fill="#c4b5fd" font-family="monospace" font-size="10">Deep Learning Lab</text>
    <text x="30" y="78" fill="#38bdf8" font-family="monospace" font-size="9">UB 402 // Slot C2 • Active</text>

    <rect x="20" y="92" width="170" height="38" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.05)"/>
    <text x="30" y="108" fill="#e2e8f0" font-family="monospace" font-size="10">Exam Predictor: Ready</text>
    <text x="30" y="122" fill="#34d399" font-family="monospace" font-size="9">PYQ Model: 100% Synced</text>
  </g>

  <!-- Bottom Floating Bar: Tech Stack & System Status -->
  <g transform="translate(180, 360)">
    <rect width="440" height="50" rx="25" fill="rgba(8, 20, 38, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <circle cx="35" cy="25" r="6" fill="#34d399" filter="url(#anGlow)"/>
    <text x="52" y="29" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="bold">ACADEMIA NEXUS 3D</text>
    <text x="210" y="29" fill="#94a3b8" font-family="monospace" font-size="11">Next.js • Three.js • Framer Motion</text>
  </g>
</svg>
